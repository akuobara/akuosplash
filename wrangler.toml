name = "akuosplash"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat_v2"]

# Usar Workers Assets (en vez de Pages static) para servir Next.js con SSR
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Worker principal de OpenNext
main = ".open-next/worker.js"

[vars]
NEXT_PUBLIC_APP_URL = "https://akuosplash.pages.dev"

# R2 bucket binding (cuando esté creado el bucket akuosplash-uploads)
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "akuosplash-uploads"

# Observability
[observability]
enabled = true
